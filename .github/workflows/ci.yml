name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: pnpmの公開後24時間を確認
        run: node tools/dependency-policy.mjs
      - name: 固定バージョンのpnpmを準備
        run: |
          npm install --global --ignore-scripts "$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).packageManager')"
      - name: ロックファイルと公開後24時間を検証してインストール
        run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
