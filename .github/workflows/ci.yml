name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: pnpmの公開後24時間を確認
        run: node tools/dependency-policy.mjs
      - name: 固定バージョンのpnpmを準備
        run: |
          npm install --global --ignore-scripts "$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).packageManager')"
      - name: ロックファイルと公開後24時間を検証してインストール
        run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - name: Netlifyの公開成果物を確認
        env:
          DEPLOY_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--grand-kelpie-9ab667.netlify.app', github.event.number) || 'https://ptrst102.com' }}
          PREVIOUS_URL: ${{ github.event_name == 'pull_request' && 'https://ptrst102.com' || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 記事を更新するPRでは、意図した記事・カード変更を許可する。
          if [ -n "$PREVIOUS_URL" ] && ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- src/content/blog; then
            PREVIOUS_URL=""
          fi
          node tools/check-deployment.mjs "$DEPLOY_URL" "$PREVIOUS_URL"
